name: disasterwatch_app
description: AI-powered disaster intelligence for first responders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  image_picker: ^1.0.7
  
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  
  dio: ^5.4.1
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo_cache.json
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700